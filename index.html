<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Journal - TCL T513V</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --up-color: #00e5ff;
            --down-color: #ff9999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }

        .table-container {
            flex-grow: 1;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-weight: normal;
            font-size: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        th:first-child, td:first-child { text-align: left; padding-left: 8px; }
        th:last-child, td:last-child { padding-right: 8px; }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid var(--border);
            text-align: right;
            vertical-align: middle;
        }

        .name-col { font-weight: bold; }
        .qty-col, .stk-col { color: var(--text-main); }
        .price-col { font-weight: bold; }
        
        .up { color: var(--up-color); }
        .down { color: var(--down-color); }

        .percent-col {
            font-size: 15px;
            font-weight: bold;
        }

        .bottom-panel {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 12px 10px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .add-row, .backup-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-backup {
            background-color: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            flex: 1;
            padding: 12px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 16px;
        }

        button.btn-add {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .modal h3 { margin-top: 0; margin-bottom: 15px; color: var(--text-main); font-size: 18px; }
        .modal-field { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .modal-field label { font-size: 14px; color: var(--text-muted); }
        .modal-field input { width: 55%; font-size: 16px; box-sizing: border-box; padding: 10px; }
        
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
        .btn-save { background-color: #1f6feb; flex: 1; border: none; padding: 12px 6px; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; cursor: pointer;}
        .btn-delete { background-color: var(--down-color); flex: 1; border: none; padding: 12px 6px; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; cursor: pointer;}
        .btn-cancel { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); flex: 1; padding: 12px 6px; border-radius: 6px; font-size: 14px; cursor: pointer;}
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Stk</th>
                    <th>Qty</th>
                    <th>Last</th>
                    <th>Current</th>
                    <th>Delta</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="bottom-panel">
        <div class="add-row">
            <input type="text" id="new-ticker" placeholder="Тикер (напр. TSLA)" autocomplete="off">
            <button class="btn-add" onclick="addNewTicker()">Добавить</button>
        </div>
        <div class="backup-row">
            <button class="btn-backup" onclick="exportData()">Выгрузить JSON</button>
            <button class="btn-backup" onclick="document.getElementById('file-input').click()">Загрузить JSON</button>
            <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3 id="modal-title">Редактирование</h3>
            <div class="modal-field">
                <label>Общее (Stk):</label>
                <input type="text" inputmode="decimal" id="edit-stk">
            </div>
            <div class="modal-field">
                <label>Сделка (Qty):</label>
                <div style="display: flex; gap: 6px; width: 55%;">
                    <button type="button" onclick="toggleSign('edit-qty')" style="padding: 5px 10px; background: #30363d; border: 1px solid var(--border); color: white; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer;">±</button>
                    <input type="text" inputmode="decimal" id="edit-qty" style="width: 100%;">
                </div>
            </div>
            <div class="modal-field">
                <label>Цена (Last):</label>
                <input type="text" inputmode="decimal" id="edit-last">
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="savePosition()">Сохр.</button>
                <button class="btn-delete" onclick="deletePosition()">Удалить</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynsJ2EGFpJBa9DAouEoP4s8vovb4ref_HzSZQ9qahEmfxhbnnSEg9Kt2CPvVL2ENIL/exec';
        
        const defaultPortfolio = [
            { ticker: 'LCID', stk: 15, qty: 5, last: 6.40, current: 6.47, delta: 0.07, percent: 1.1 },
            { ticker: 'SOFI', stk: 12, qty: 2, last: 17.85, current: 17.93, delta: 0.08, percent: 0.4 },
            { ticker: 'TSCO', stk: 7, qty: -3, last: 36.30, current: 36.40, delta: 0.10, percent: 0.3 }
        ];

        let portfolio = defaultPortfolio;
        try {
            const savedData = localStorage.getItem('myPortfolio');
            if (savedData) {
                portfolio = JSON.parse(savedData);
                if (!Array.isArray(portfolio)) portfolio = defaultPortfolio;
            }
        } catch (e) {
            console.error("Ошибка загрузки локальных данных:", e);
            portfolio = defaultPortfolio;
        }

        let editingTicker = null;
        let pressTimer = null;

        function saveToLocal() {
            localStorage.setItem('myPortfolio', JSON.stringify(portfolio));
        }

        function isSortingEligible(item) {
            const hasStk = item.stk !== null && item.stk !== undefined && item.stk !== 0 && item.stk !== '0' && item.stk !== '';
            if (hasStk) return true;
            return item.delta < 0;
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            portfolio.sort((a, b) => {
                const aEligible = isSortingEligible(a);
                const bEligible = isSortingEligible(b);

                if (aEligible && !bEligible) return -1;
                if (!aEligible && bEligible) return 1;

                if (aEligible && bEligible) {
                    const aMissing = (a.percent <= -100 || !a.current || a.current === 0);
                    const bMissing = (b.percent <= -100 || !b.current || b.current === 0);
                    
                    if (aMissing && !bMissing) return 1;
                    if (!aMissing && bMissing) return -1;
                }

                return Math.abs(b.percent) - Math.abs(a.percent);
            });

            portfolio.forEach(item => {
                const isUp = item.delta > 0;
                const isDown = item.delta < 0;
                const colorClass = isUp ? 'up' : (isDown ? 'down' : '');
                const sign = isUp ? '+' : '';

                const tr = document.createElement('tr');
                
                const hasStk = item.stk !== null && item.stk !== undefined && item.stk !== 0 && item.stk !== '0' && item.stk !== '';
                if (!hasStk && item.delta >= 0) {
                    tr.style.opacity = '0.5';
                }

                tr.addEventListener('touchstart', (e) => startLongPress(e, item.ticker));
                tr.addEventListener('touchend', cancelLongPress);
                tr.addEventListener('touchmove', cancelLongPress);
                
                tr.addEventListener('mousedown', (e) => startLongPress(e, item.ticker));
                tr.addEventListener('mouseup', cancelLongPress);
                tr.addEventListener('mouseleave', cancelLongPress);

                tr.innerHTML = `
                    <td class="name-col">${item.ticker}</td>
                    <td class="stk-col">${item.stk || ''}</td>
                    <td class="qty-col">${item.qty || ''}</td>
                    <td class="price-col">${item.last ? item.last.toFixed(2) : ''}</td>
                    <td class="price-col">${item.current ? item.current.toFixed(2) : ''}</td>
                    <td class="${colorClass}">${sign}${item.delta ? item.delta.toFixed(2) : '0.00'}</td>
                    <td class="${colorClass} percent-col">${sign}${item.percent ? item.percent.toFixed(1) : '0.0'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function startLongPress(e, ticker) {
            pressTimer = setTimeout(() => {
                openEditModal(ticker);
                if (navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }

        function cancelLongPress() {
            if (pressTimer) clearTimeout(pressTimer);
        }

        function openEditModal(ticker) {
            cancelLongPress();
            editingTicker = ticker;
            const item = portfolio.find(p => p.ticker === ticker);
            
            document.getElementById('modal-title').innerText = `Изменить: ${ticker}`;
            document.getElementById('edit-stk').value = item.stk || 0;
            document.getElementById('edit-qty').value = item.qty || 0;
            document.getElementById('edit-last').value = item.last || 0;
            
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
            editingTicker = null;
        }

        function toggleSign(inputId) {
            const input = document.getElementById(inputId);
            let val = input.value.toString().trim();
            if (!val) return;
            if (val.startsWith('-')) {
                input.value = val.substring(1);
            } else {
                input.value = '-' + val;
            }
        }

        function parseInputValue(id) {
            const val = document.getElementById(id).value.toString().replace(',', '.').trim();
            return parseFloat(val) || 0;
        }

        function savePosition() {
            const item = portfolio.find(p => p.ticker === editingTicker);
            if (item) {
                item.stk = parseInputValue('edit-stk');
                item.qty = parseInputValue('edit-qty');
                item.last = parseInputValue('edit-last');
                
                item.delta = item.current > 0 ? (item.current - item.last) : 0;
                item.percent = item.last > 0 ? (item.delta / item.last) * 100 : 0;
            }
            saveToLocal();
            closeModal();
            renderTable();
        }

        function deletePosition() {
            if(confirm(`Точно удалить ${editingTicker}?`)) {
                portfolio = portfolio.filter(p => p.ticker !== editingTicker);
                saveToLocal();
                closeModal();
                renderTable();
            }
        }

        function addNewTicker() {
            const input = document.getElementById('new-ticker');
            let ticker = input.value.trim().toUpperCase();
            
            if (!ticker) return;
            if (portfolio.some(p => p.ticker === ticker)) {
                alert('Инструмент уже в списке!');
                return;
            }

            portfolio.push({
                ticker: ticker, stk: 0, qty: 0, last: 0, current: 0, delta: 0, percent: 0
            });
            
            input.value = '';
            saveToLocal();
            renderTable();
            updatePrices();
        }

        async function exportData() {
            const jsonString = JSON.stringify(portfolio, null, 2);
            const fileName = 'portfolio_backup.json';
            const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });

            const file = new File([blob], fileName, { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Резервная копия портфеля',
                        text: 'Бэкап портфеля'
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = fileName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let rawText = e.target.result;
                    if (typeof rawText === 'string') {
                        rawText = rawText.trim().replace(/^\uFEFF/, '');
                    }
                    const importedPortfolio = JSON.parse(rawText);
                    if (Array.isArray(importedPortfolio)) {
                        portfolio = importedPortfolio;
                        saveToLocal();
                        renderTable();
                        updatePrices();
                        alert('Портфель успешно загружен!');
                    } else {
                        alert('Ошибка: Файл должен содержать массив позиций.');
                    }
                } catch (err) {
                    alert(`Ошибка чтения файла: ${err.message}`);
                }
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function processApiData(data) {
            data.forEach(apiItem => {
                const portItem = portfolio.find(p => p.ticker === apiItem.ticker);
                if (portItem) {
                    portItem.current = apiItem.price;
                    if (portItem.last > 0) {
                        portItem.delta = portItem.current - portItem.last;
                        portItem.percent = (portItem.delta / portItem.last) * 100;
                    } else {
                        portItem.percent = apiItem.change || 0;
                    }
                }
            });
            saveToLocal();
            renderTable();
        }

        async function updatePrices() {
            if (portfolio.length === 0) return;
            const tickersList = portfolio.map(p => p.ticker).join(',');

            try {
                const response = await fetch(`${SCRIPT_URL}?tickers=${tickersList}`);
                const result = name = await response.json(); // safety fix below in clean parsing

                if (!result.error && result.data) {
                    processApiData(result.data);

                    const missingTickers = portfolio.filter(p => isSortingEligible(p) && (p.percent <= -100 || !p.current || p.current === 0)).map(p => p.ticker);
                    
                    if (missingTickers.length > 0) {
                        setTimeout(async () => {
                            try {
                                const retryResponse = await fetch(`${SCRIPT_URL}?tickers=${missingTickers.join(',')}`);
                                const retryResult = await retryResponse.json();
                                if (!retryResult.error && retryResult.data) {
                                    processApiData(retryResult.data);
                                }
                            } catch (e) {
                                console.error('Ошибка повторного получения цен:', e);
                            }
                        }, 7000);
                    }
                }
            } catch (e) {
                console.error('Ошибка обновления:', e);
            }
        }

        renderTable();
        updatePrices();
        setInterval(updatePrices, 60000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Journal - TCL T513V</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --up-color: #00e5ff;
            --down-color: #ff6666;
            --up-bright: #39ff14;
            --down-bright: #ffee00;
            --limit-buy: #39ff14;
            --limit-sell: #ffee00;
            --limit-both: #ff0055;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }

        .table-container {
            flex-grow: 1;
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-weight: normal;
            font-size: 11px;
            padding: 5px 2px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        th:first-child, td:first-child { text-align: left; padding-left: 6px; }
        th:last-child, td:last-child { padding-right: 6px; }

        td {
            padding: 5px 2px;
            border-bottom: 1px solid var(--border);
            text-align: right;
            vertical-align: middle;
            line-height: 1.2;
        }

        .name-col { font-weight: bold; }
        .name-buy { color: var(--limit-buy) !important; }
        .name-sell { color: var(--limit-sell) !important; }
        .name-both { color: var(--limit-both) !important; }

        .qty-col, .stk-col { color: var(--text-main); }
        .price-col { font-weight: bold; }
        
        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        .up-bright { color: var(--up-bright); }
        .down-bright { color: var(--down-bright); }

        .bottom-panel {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 10px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .add-row, .backup-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-backup {
            background-color: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            flex: 1;
            padding: 10px 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 15px;
        }

        button.btn-add {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 340px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .modal h3 { margin-top: 0; margin-bottom: 12px; color: var(--text-main); font-size: 17px; }
        .modal-field { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .modal-field label { font-size: 13px; color: var(--text-muted); }
        .modal-field input[type="text"] { width: 55%; font-size: 15px; box-sizing: border-box; padding: 8px; }
        
        .checkbox-group {
            display: flex;
            gap: 16px;
            width: 55%;
            align-items: center;
        }
        .checkbox-group label {
            color: var(--text-main);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1f6feb;
            cursor: pointer;
        }
        
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn-save { background-color: #1f6feb; flex: 1; border: none; padding: 10px 6px; border-radius: 6px; color: white; font-weight: bold; font-size: 13px; cursor: pointer;}
        .btn-delete { background-color: var(--down-color); flex: 1; border: none; padding: 10px 6px; border-radius: 6px; color: white; font-weight: bold; font-size: 13px; cursor: pointer;}
        .btn-cancel { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); flex: 1; padding: 10px 6px; border-radius: 6px; font-size: 13px; cursor: pointer;}
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Stk</th>
                    <th>Qty</th>
                    <th>Last</th>
                    <th>Current</th>
                    <th>Delta</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="bottom-panel">
        <div class="add-row">
            <input type="text" id="new-ticker" placeholder="Тикер (напр. TSLA)" autocomplete="off">
            <button class="btn-add" onclick="addNewTicker()">Добавить</button>
        </div>
        <div class="backup-row">
            <button class="btn-backup" onclick="exportData()">Выгрузить JSON</button>
            <button class="btn-backup" onclick="document.getElementById('file-input').click()">Загрузить JSON</button>
            <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3 id="modal-title">Редактирование</h3>
            <div class="modal-field">
                <label>Общее (Stk):</label>
                <input type="text" inputmode="decimal" id="edit-stk">
            </div>
            <div class="modal-field">
                <label>Сделка (Qty):</label>
                <div style="width: 55%; display: flex; gap: 4px; align-items: center;">
                    <button type="button" onclick="toggleSign('edit-qty')" style="padding: 4px 8px; background: #30363d; border: 1px solid var(--border); color: white; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">±</button>
                    <input type="text" inputmode="decimal" id="edit-qty" style="width: 100%;">
                </div>
            </div>
            <div class="modal-field" style="margin-top: -6px; margin-bottom: 12px;">
                <label></label>
                <div style="width: 55%;">
                    <label style="font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="edit-apply-qty" style="width: 18px; height: 18px; accent-color: #1f6feb; cursor: pointer;"> Учитывать сделку
                    </label>
                </div>
            </div>
            <div class="modal-field">
                <label>Цена (Last):</label>
                <div style="display: flex; gap: 4px; width: 55%; align-items: center;">
                    <input type="text" inputmode="numeric" id="edit-last" style="width: 100%; text-align: right;" placeholder="0.00" oninput="handleCurrencyInput(event)" onkeydown="handleCurrencyKeyDown(event)">
                    <button type="button" onclick="clearCurrencyInput()" style="background: #30363d; border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; padding: 8px 6px; font-size: 12px; cursor: pointer;" title="Сбросить">×</button>
                </div>
            </div>
            <div class="modal-field">
                <label>Limit order:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="edit-buy"> Buy</label>
                    <label><input type="checkbox" id="edit-sell"> Sell</label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="savePosition()">Сохр.</button>
                <button class="btn-delete" onclick="deletePosition()">Удалить</button>
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynsJ2EGFpJBa9DAouEoP4s8vovb4ref_HzSZQ9qahEmfxhbnnSEg9Kt2CPvVL2ENIL/exec';
        
        const defaultPortfolio = [
            { ticker: 'LCID', stk: 15, qty: 5, last: 6.40, current: 6.47, delta: 0.07, percent: 1.1, limitBuy: false, limitSell: false },
            { ticker: 'SOFI', stk: 12, qty: 2, last: 17.85, current: 17.93, delta: 0.08, percent: 0.4, limitBuy: true, limitSell: false },
            { ticker: 'TSCO', stk: 7, qty: -3, last: 36.30, current: 36.40, delta: 0.10, percent: 0.3, limitBuy: false, limitSell: true }
        ];

        let portfolio = defaultPortfolio;
        try {
            const savedData = localStorage.getItem('myPortfolio');
            if (savedData) {
                let parsedData = JSON.parse(savedData);
                if (Array.isArray(parsedData)) {
                    portfolio = parsedData.map(item => ({
                        ticker: item.ticker || 'UNKNOWN',
                        stk: parseFloat(item.stk) || 0,
                        qty: parseFloat(item.qty) || 0,
                        last: parseFloat(item.last) || 0,
                        current: parseFloat(item.current) || 0,
                        delta: parseFloat(item.delta) || 0,
                        percent: parseFloat(item.percent) || 0,
                        limitBuy: !!item.limitBuy,
                        limitSell: !!item.limitSell
                    }));
                }
            }
        } catch (e) {
            console.error("Ошибка загрузки локальных данных:", e);
            portfolio = defaultPortfolio;
        }

        let editingTicker = null;
        let pressTimer = null;
        let rawCentsValue = 0;

        function saveToLocal() {
            localStorage.setItem('myPortfolio', JSON.stringify(portfolio));
        }

        function isSortingEligible(item) {
            const hasStk = item.stk !== null && item.stk !== undefined && item.stk !== 0;
            if (hasStk) return true;
            return item.delta < 0;
        }

        function adjustDynamicFontSize() {
            let maxTickerLen = 4;
            portfolio.forEach(item => {
                if (item.ticker && item.ticker.length > maxTickerLen) {
                    maxTickerLen = item.ticker.length;
                }
            });

            let targetSize = 16;
            if (maxTickerLen > 4) {
                targetSize = Math.max(12, 16 - (maxTickerLen - 4) * 1.0);
            } else {
                targetSize = 17.5;
            }

            const table = document.querySelector('table');
            table.style.fontSize = targetSize + 'px';

            const enhancedCols = document.querySelectorAll('.delta-col, .percent-col');
            enhancedCols.forEach(el => {
                el.style.fontSize = (targetSize * 1.1) + 'px';
            });
        }

        function updateCurrencyDisplay() {
            const input = document.getElementById('edit-last');
            const numericVal = (rawCentsValue / 100).toFixed(2);
            input.value = numericVal;
        }

        function handleCurrencyKeyDown(e) {
            if (e.key === 'Backspace') {
                e.preventDefault();
                rawCentsValue = Math.floor(rawCentsValue / 10);
                updateCurrencyDisplay();
            } else if (!isNaN(e.key) && e.key !== ' ') {
                e.preventDefault();
                if (rawCentsValue < 100000000) {
                    rawCentsValue = rawCentsValue * 10 + parseInt(e.key, 10);
                    updateCurrencyDisplay();
                }
            }
        }

        function handleCurrencyInput(e) {
            updateCurrencyDisplay();
        }

        function clearCurrencyInput() {
            rawCentsValue = 0;
            updateCurrencyDisplay();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            portfolio.sort((a, b) => {
                const aEligible = isSortingEligible(a);
                const bEligible = isSortingEligible(b);

                if (aEligible && !bEligible) return -1;
                if (!aEligible && bEligible) return 1;

                if (aEligible && bEligible) {
                    const aMissing = (a.percent <= -100 || !a.current || a.current === 0);
                    const bMissing = (b.percent <= -100 || !b.current || b.current === 0);
                    
                    if (aMissing && !bMissing) return 1;
                    if (!aMissing && bMissing) return -1;
                }

                return Math.abs(b.percent) - Math.abs(a.percent);
            });

            portfolio.forEach(item => {
                const isUp = item.delta > 0;
                const isDown = item.delta < 0;
                const absDelta = Math.abs(item.delta || 0);
                const isBright = absDelta >= 0.25;

                const percentColorClass = isUp ? 'up' : (isDown ? 'down' : '');
                
                let deltaColorClass = '';
                if (isUp) {
                    deltaColorClass = isBright ? 'up-bright' : 'up';
                } else if (isDown) {
                    deltaColorClass = isBright ? 'down-bright' : 'down';
                }

                const sign = isUp ? '+' : '';
                
                let nameClass = 'name-col';
                if (item.limitBuy && item.limitSell) {
                    nameClass += ' name-both';
                } else if (item.limitBuy) {
                    nameClass += ' name-buy';
                } else if (item.limitSell) {
                    nameClass += ' name-sell';
                }

                const tr = document.createElement('tr');
                
                const hasStk = item.stk !== 0;
                if (!hasStk && item.delta >= 0) {
                    tr.style.opacity = '0.5';
                }

                tr.addEventListener('touchstart', (e) => startLongPress(e, item.ticker));
                tr.addEventListener('touchend', cancelLongPress);
                tr.addEventListener('touchmove', cancelLongPress);
                
                tr.addEventListener('mousedown', (e) => startLongPress(e, item.ticker));
                tr.addEventListener('mouseup', cancelLongPress);
                tr.addEventListener('mouseleave', cancelLongPress);

                tr.innerHTML = `
                    <td class="${nameClass}">${item.ticker}</td>
                    <td class="stk-col">${item.stk || ''}</td>
                    <td class="qty-col">${item.qty || ''}</td>
                    <td class="price-col">${item.last ? item.last.toFixed(2) : ''}</td>
                    <td class="price-col">${item.current ? item.current.toFixed(2) : ''}</td>
                    <td class="delta-col ${deltaColorClass}">${sign}${item.delta ? item.delta.toFixed(2) : '0.00'}</td>
                    <td class="percent-col ${percentColorClass}">${sign}${item.percent ? item.percent.toFixed(1) : '0.0'}</td>
                `;
                tbody.appendChild(tr);
            });

            adjustDynamicFontSize();
        }

        function startLongPress(e, ticker) {
            pressTimer = setTimeout(() => {
                openEditModal(ticker);
                if (navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }

        function cancelLongPress() {
            if (pressTimer) clearTimeout(pressTimer);
        }

        function openEditModal(ticker) {
            cancelLongPress();
            editingTicker = ticker;
            const item = portfolio.find(p => p.ticker === ticker);
            
            document.getElementById('modal-title').innerText = `Изменить: ${ticker}`;
            document.getElementById('edit-stk').value = item.stk || 0;
            document.getElementById('edit-qty').value = item.qty || 0;
            
            // Чекбокс по умолчанию выбран
            document.getElementById('edit-apply-qty').checked = true;
            
            const lastPrice = parseFloat(item.last) || 0;
            rawCentsValue = Math.round(lastPrice * 100);
            updateCurrencyDisplay();

            document.getElementById('edit-buy').checked = !!item.limitBuy;
            document.getElementById('edit-sell').checked = !!item.limitSell;
            
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
            editingTicker = null;
        }

        function toggleSign(inputId) {
            const input = document.getElementById(inputId);
            let val = input.value.toString().trim();
            if (!val) return;
            if (val.startsWith('-')) {
                input.value = val.substring(1);
            } else {
                input.value = '-' + val;
            }
        }

        function parseInputValue(id) {
            const val = document.getElementById(id).value.toString().replace(',', '.').trim();
            return parseFloat(val) || 0;
        }

        function savePosition() {
            const item = portfolio.find(p => p.ticker === editingTicker);
            if (item) {
                const applyQty = document.getElementById('edit-apply-qty').checked;
                
                if (applyQty) {
                    const currentStk = parseFloat(item.stk) || 0;
                    const changeQty = parseInputValue('edit-qty');
                    item.stk = currentStk + changeQty;
                    item.qty = changeQty;
                } else {
                    item.stk = parseInputValue('edit-stk');
                }
                
                item.last = rawCentsValue / 100;
                
                item.limitBuy = document.getElementById('edit-buy').checked;
                item.limitSell = document.getElementById('edit-sell').checked;
                
                item.delta = item.current > 0 ? (item.current - item.last) : 0;
                item.percent = item.last > 0 ? (item.delta / item.last) * 100 : 0;
            }
            saveToLocal();
            closeModal();
            renderTable();
        }

        function deletePosition() {
            if(confirm(`Точно удалить ${editingTicker}?`)) {
                portfolio = portfolio.filter(p => p.ticker !== editingTicker);
                saveToLocal();
                closeModal();
                renderTable();
            }
        }

        function addNewTicker() {
            const input = document.getElementById('new-ticker');
            let ticker = input.value.trim().toUpperCase();
            
            if (!ticker) return;
            if (portfolio.some(p => p.ticker === ticker)) {
                alert('Инструмент уже в списке!');
                return;
            }

            portfolio.push({
                ticker: ticker, stk: 0, qty: 0, last: 0, current: 0, delta: 0, percent: 0, limitBuy: false, limitSell: false
            });
            
            input.value = '';
            saveToLocal();
            renderTable();
            updatePrices();
        }

        async function exportData() {
            const jsonString = JSON.stringify(portfolio, null, 2);
            const fileName = 'portfolio_backup.json';
            const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });

            const file = new File([blob], fileName, { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Резервная копия портфеля',
                        text: 'Бэкап портфеля'
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = fileName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let rawText = e.target.result;
                    if (typeof rawText === 'string') {
                        rawText = rawText.trim().replace(/^\uFEFF/, '');
                    }
                    const importedPortfolio = JSON.parse(rawText);
                    if (Array.isArray(importedPortfolio)) {
                        portfolio = importedPortfolio.map(item => ({
                            ticker: item.ticker || 'UNKNOWN',
                            stk: parseFloat(item.stk) || 0,
                            qty: parseFloat(item.qty) || 0,
                            last: parseFloat(item.last) || 0,
                            current: parseFloat(item.current) || 0,
                            delta: parseFloat(item.delta) || 0,
                            percent: parseFloat(item.percent) || 0,
                            limitBuy: !!item.limitBuy,
                            limitSell: !!item.limitSell
                        }));
                        saveToLocal();
                        renderTable();
                        updatePrices();
                        alert('Портфель успешно загружен!');
                    } else {
                        alert('Ошибка: Файл должен содержать массив позиций.');
                    }
                } catch (err) {
                    alert(`Ошибка чтения файла: ${err.message}`);
                }
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function processApiData(data) {
            data.forEach(apiItem => {
                const portItem = portfolio.find(p => p.ticker === apiItem.ticker);
                if (portItem) {
                    portItem.current = parseFloat(apiItem.price) || 0;
                    if (portItem.last > 0) {
                        portItem.delta = portItem.current - portItem.last;
                        portItem.percent = (portItem.delta / portItem.last) * 100;
                    } else {
                        portItem.percent = parseFloat(apiItem.change) || 0;
                    }
                }
            });
            saveToLocal();
            renderTable();
        }

        async function updatePrices() {
            if (portfolio.length === 0) return;
            const tickersList = portfolio.map(p => p.ticker).join(',');

            try {
                const response = await fetch(`${SCRIPT_URL}?tickers=${tickersList}`);
                const result = await response.json();

                if (!result.error && result.data) {
                    processApiData(result.data);

                    const missingTickers = portfolio.filter(p => isSortingEligible(p) && (p.percent <= -100 || !p.current || p.current === 0)).map(p => p.ticker);
                    
                    if (missingTickers.length > 0) {
                        setTimeout(async () => {
                            try {
                                const retryResponse = await fetch(`${SCRIPT_URL}?tickers=${missingTickers.join(',')}`);
                                const retryResult = await retryResponse.json();
                                if (!retryResult.error && retryResult.data) {
                                    processApiData(retryResult.data);
                                }
                            } catch (e) {
                                console.error('Ошибка повторного получения цен:', e);
                            }
                        }, 7000);
                    }
                }
            } catch (e) {
                console.error('Ошибка обновления:', e);
            }
        }

        renderTable();
        updatePrices();
        setInterval(updatePrices, 60000);
    </script>
</body>
</html>
